# Smart Legal Assistant Portal Configuration

# Application Name & Port
spring.application.name=smart-legal-assistant-portal
server.port=${PORT:8080}

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads/documents}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Database Connection
# Default: H2 In-Memory Database (Zero installation required!)
# To use MySQL, set DB_URL=jdbc:mysql://localhost:3306/smart_legal_db, DB_DRIVER=com.mysql.cj.jdbc.Driver, DB_DIALECT=org.hibernate.dialect.MySQLDialect
spring.datasource.url=${DB_URL:jdbc:h2:mem:smart_legal_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console Configuration (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.smartlegal.portal=DEBUG
